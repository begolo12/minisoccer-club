name: minisoccer_club
description: "Aplikasi manajemen klub mini soccer."
publish_to: 'none'
version: 1.7.0+17

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shadcn_ui: ^0.57.2
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/bc-Regular.ttf
        - asset: assets/fonts/bc-Medium.ttf
          weight: 500
        - asset: assets/fonts/bc-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/bc-Bold.ttf
          weight: 700

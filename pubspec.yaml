name: minisoccer_club
description: "Aplikasi manajemen klub mini soccer."
publish_to: 'none'
version: 1.15.2+39

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shadcn_ui: ^0.57.2
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  intl: ^0.20.2
  # Pembaruan APK: unduh ke cache + verifikasi sha256 aset GitHub.
  crypto: ^3.0.6
  path_provider: ^2.1.5
  # Cache offline di web (localStorage). Di Android dipakai berkas.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Untuk menguji jalur berkas Android (cache_io / outbox_store_io) di mesin
  # pengembang: `getApplicationSupportDirectory` dipalsukan ke direktori
  # sementara, sehingga kode yang dipakai di HP benar-benar dijalankan.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/bc-Regular.ttf
        - asset: assets/fonts/bc-Medium.ttf
          weight: 500
        - asset: assets/fonts/bc-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/bc-Bold.ttf
          weight: 700

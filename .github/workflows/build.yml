name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Repo ini publik: satu kredensial yang lolos ke sebuah commit langsung
      # bisa dipakai siapa pun, dan riwayat git tetap menyimpannya walau
      # filenya dihapus kemudian. Gagal di sini lebih murah daripada rotasi.
      - run: node scripts/secret-scan.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Kunci rilis dipasang dari secrets. Tanpa langkah ini, build rilis
      # memakai kunci debug yang dibuat ulang di setiap runner — APK-nya
      # bersertifikat berbeda dari rilis sebelumnya sehingga update ditolak
      # Android ("Aplikasi tidak terpasang") dan pengguna harus uninstall,
      # yang ikut menghapus data offline yang belum tersinkron.
      - name: Siapkan kunci rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diset — APK rilis akan ditandatangani kunci debug dan tidak bisa memperbarui aplikasi yang sudah terpasang."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.p12
          cat > android/key.properties <<EOF
          storeFile=release-keystore.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # Pastikan berkasnya ada dan tidak kosong sebelum build.
          test -s android/app/release-keystore.p12
          test -s android/key.properties

      - run: node --test "api/*.test.mjs"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Dua bentuk APK, keduanya diunggah:
      #
      #   * Universal (arm + arm64) — satu berkas yang selalu bisa dipasang.
      #     x86_64 sengaja tidak disertakan: itu arsitektur emulator, dan
      #     membuangnya memangkas ~20 MB dari setiap unduhan.
      #   * Per-ABI — aplikasi memilih yang sesuai perangkat, jadi HP lama
      #     32-bit mengunduh ~19 MB, bukan ~38 MB.
      - run: flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=API_BASE=https://minisoccer-club.vercel.app
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define=API_BASE=https://minisoccer-club.vercel.app

      # Bukti sertifikat tertanam di log build: kalau kuncinya berubah,
      # langsung terlihat di sini, bukan setelah pengguna gagal update.
      #
      # Catatan: langkah ini TIDAK boleh menggagalkan build. APK-nya sudah
      # selesai dan benar; kalau `apksigner` tidak ditemukan atau `grep` tidak
      # menemukan baris yang diharapkan, itu masalah skrip verifikasi — bukan
      # alasan membuang APK yang sudah jadi.
      - name: Verifikasi sertifikat APK (informasi)
        continue-on-error: true
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner tidak ditemukan; sertifikat tidak diverifikasi."
            exit 0
          fi
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk || true

      - name: Upload artifact (setiap push)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Release (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

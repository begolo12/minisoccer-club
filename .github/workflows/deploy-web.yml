name: Deploy Web

# Butuh 4 secret di repo (Settings -> Secrets -> Actions):
#   VERCEL_TOKEN      token dari vercel.com/account/tokens
#   VERCEL_ORG_ID     dari .vercel/project.json setelah `vercel link`
#   VERCEL_PROJECT_ID sama seperti di atas
# AUTH_SECRET dan DATABASE_URL diset di env Vercel, tidak di repo.
# DATABASE_URL tidak di-build ke web — diset di env Vercel saja.

on:
  # Sengaja manual: kalau dijalankan otomatis sebelum secret diisi, run-nya merah.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo ini publik: satu kredensial yang lolos ke sebuah commit langsung
      # bisa dipakai siapa pun, dan riwayat git tetap menyimpannya walau
      # filenya dihapus kemudian. Gagal di sini lebih murah daripada rotasi.
      - run: node scripts/secret-scan.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `api/sql.js` mengimpor `@neondatabase/serverless`; tesnya butuh paket
      # itu terpasang di runner bersih.
      - run: npm ci --omit=dev
      - run: node --test "api/*.test.mjs"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --base-href /minisoccer/

      - name: Deploy ke Vercel
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
